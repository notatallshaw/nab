[project]
name = "nab-python"
version = "0.0.13"
description = "Index-backed provider, lockfile emitter, and downloader for nab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Damian Shaw", email = "damian.peter.shaw@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "nab-resolver==0.0.13",
    "nab-index==0.0.13",
    "tomli>=2.0",
    "tomli_w>=1.2",
    "build>=1.2",
    "installer>=1.0",
    "pyproject_hooks>=1.2",
    "typing_extensions>=4.6",
]

[project.urls]
Homepage = "https://github.com/notatallshaw/nab"
Documentation = "https://nab.readthedocs.io/"
Issues = "https://github.com/notatallshaw/nab/issues"
Source = "https://github.com/notatallshaw/nab"
Changelog = "https://github.com/notatallshaw/nab/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Benchmarks are development tooling, not part of the shipped package, so the
# sdist carries only the source and tests.
[tool.hatch.build.targets.sdist]
exclude = ["/benchmarks"]
