# Scenarios collected from upstream issue trackers that nab cannot
# execute yet because the requirement list itself uses a feature nab
# does not implement.  Each entry documents the inputs and the missing
# feature.  scenarios.py picks this file up but skips entries with an
# `unsupported_reason` key, so the file doubles as a backlog: drop the
# key (and migrate the entry to problematic.toml) once nab can run it.
#
# Recurring blockers:
#
#   vcs_dependencies     - Requirements like "pkg @ git+https://...".
#                          nab has no VCS clone+build path.
#   url_dependencies     - Direct URL or local-path requirements.
#   multiple_indexes     - Extra indexes (PyTorch CPU/CUDA, Azure, etc.)
#                          or per-package source overrides. nab only
#                          accepts a single PyPI Simple URL today.
#   workspace_sources    - uv workspace [tool.uv.sources] overrides.
#
# Scenarios in this file that *would* run on nab but were originally
# filed against a tool-specific feature have been migrated to
# problematic.toml.  See the migration block at the end of that file.
#
# Placeholder scenarios (non-existent package names captured only for
# upstream issue context) used to live here under
# `unsupported_reason = "placeholder"`.  They have been removed because
# they have no benchmark value.

