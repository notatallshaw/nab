# Universal-resolution benchmark scenarios.
#
# Each entry exercises the matrix-based universal resolver in
# ``examples/universal/``.  Scenarios are sourced from real-world
# reports of slow or problematic universal locks in uv, Poetry, and PEX,
# plus a few explicitly labeled real-world stress cases.
#
# Schema (all optional except python, platforms, and requirements):
#
#   python = ">=3.11, <3.13"             # PEP 440 specifier set
#   platforms = ["linux_x86_64", ...]    # known platform ids
#   python_order = "asc"                 # asc (default) or desc
#   requirements = ["pkg>=1.0", ...]
#   constraints = ["pkg<2.0", ...]       # optional
#   datetime = "2025-06-01 14:00:00"     # exclude-newer-style cap
#   align_across_tuples = false          # disable cross-target alignment
#   resolution_strategy = "lowest"       # uv --resolution
#   reason = "uv issue #1560"            # reference for the case
#   skip_on_fail = false                 # if true, treat resolution failure as expected

# ---------------------------------------------------------------------------
# Sourced from uv issue #1560 / #5962:
# apache-airflow has long been the canary for resolver pathologies
# under universal/exclude-newer.  This is the smaller "all" subset.
# ---------------------------------------------------------------------------
[apache-airflow-universal]
reason = "uv #5962: airflow benchmark regression"
python = ">=3.10, <3.13"
platforms = ["linux_x86_64"]
requirements = ["apache-airflow"]
datetime = "2024-08-08 00:00:00"

# ---------------------------------------------------------------------------
# Sourced from uv issue #8157 (numba / numpy / llvmlite):
# uv backtracks numba to an ancient version, which picks an ancient
# llvmlite that fails to build.  Universal version of this case.
# ---------------------------------------------------------------------------
[numpy-numba-universal]
reason = "uv #8157: numba+numpy backtracks to ancient llvmlite"
python = ">=3.11, <3.13"
platforms = ["linux_x86_64", "macos_arm64"]
requirements = ["numpy>=2.1,<2.2", "numba<=0.60,>0.1"]
datetime = "2025-06-01 00:00:00"

# ---------------------------------------------------------------------------
# Sourced from uv issue #8157 (sentry/python-rapidjson/sentry-kafka-schemas):
# locks wrong RapidJSON, requires 62+ metadata fetches.
# ---------------------------------------------------------------------------
[sentry-rapidjson-universal]
reason = "uv #8157: 62+ metadata fetches for kafka-schemas"
python = ">=3.10, <3.13"
platforms = ["linux_x86_64"]
requirements = [
    "python-rapidjson<=1.20,>=1.4",
    "sentry-kafka-schemas<=0.1.113,>=0.1.50",
]
datetime = "2025-01-01 00:00:00"

# ---------------------------------------------------------------------------
# Sourced from uv issue #1398:
# urllib3 2.0 pinned early, then boto3/botocore upper bounds force
# backtracking through hundreds of versions.  Universal magnifies.
# ---------------------------------------------------------------------------
[boto3-urllib3-universal]
reason = "uv #1398, poetry #7937: urllib3/boto3 lockstep"
python = ">=3.10, <3.13"
platforms = ["linux_x86_64"]
requirements = [
    "click>=7.0",
    "click-loglevel~=0.2",
    "dandi>=0.24.0",
    "psutil~=5.9",
    "pyyaml",
    "selenium",
]
datetime = "2023-10-01 00:00:00"

# ---------------------------------------------------------------------------
# Sourced from uv issue #8157 (starlette/fastapi):
# resolver backtracks to ancient FastAPI versions that don't depend
# on Starlette at all.
# ---------------------------------------------------------------------------
[starlette-fastapi-universal]
reason = "uv #8157: fastapi backtracks past starlette dep"
python = ">=3.10, <3.13"
platforms = ["linux_x86_64", "macos_arm64", "windows_amd64"]
requirements = [
    "starlette<=0.36.0",
    "fastapi<=0.115.2",
]
datetime = "2024-12-01 00:00:00"

# ---------------------------------------------------------------------------
# Sourced from uv issue #1560:
# apache-beam<=2.49.0 + dill<0.3.9,>=0.2.2 forces ancient apache-beam
# under py3.10.
# ---------------------------------------------------------------------------
[airflow-beam-dill]
reason = "uv #3078: dill+apache-beam backtrack on py3.10"
python = ">=3.10, <3.11"
platforms = ["linux_x86_64"]
requirements = [
    "dill<0.3.9,>=0.2.2",
    "apache-beam<=2.49.0",
]
datetime = "2024-08-08 00:00:00"

# ---------------------------------------------------------------------------
# Sourced from poetry #4924, mirosval.sk blog post on poetry slowness:
# the simple-looking small dep set that took 15 minutes.
# ---------------------------------------------------------------------------
[poetry-numpy-deveps]
reason = "poetry #4924: numpy + dev deps took 15min in poetry"
