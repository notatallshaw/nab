# Apache Airflow scenarios.
#
# apache-airflow has one of the deepest dependency trees on PyPI.
# Provider extras multiply the search space and backtracking on cffi,
# cryptography, snowflake-connector-python, and SQLAlchemy is common.

[apache-airflow-beam]
# https://github.com/astral-sh/uv/issues/3078#issuecomment-2062907457
# rip #174 captures the same family.
resolution = "lowest-direct"
python_version = "3.11"
platform_system = "Linux"
datetime = "2024-04-17 14:00:00"
requirements = ["apache-airflow[apache-beam]==2.8.4"]

[airflow-beam-dill]
# https://github.com/astral-sh/uv/issues/3078#issuecomment-2062907457
# Backtracks all of apache-beam looking for a compatible dill.
resolution = "lowest-direct"
python_version = "3.11"
platform_system = "Linux"
datetime = "2024-04-17 14:00:00"
requirements = ["dill>=0.2.2", "apache-beam<=2.49.0"]

