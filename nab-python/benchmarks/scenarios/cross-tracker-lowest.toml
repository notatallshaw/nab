# Cross-tracker follow-ups.
#
# Scenarios motivated by an issue in one ecosystem but reproduced
# with inputs harvested from another (poetry+rip+pdm overlap, etc).

[cross-boto3-aiobotocore-full]
# Combined from poetry 5962 + rip 191 + pdm 2633.
# aiobotocore + boto3 + pinned urllib3 at 2024-ish.
resolution = "lowest"
python_version = "3.10"
platform_system = "Linux"
datetime = "2024-02-15 11:48:13"
requirements = [
    "aiobotocore>=2.2.0",
    "boto3>=1.34.25",
    "urllib3<2",
]

