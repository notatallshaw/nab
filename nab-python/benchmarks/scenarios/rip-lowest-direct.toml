# Resolver scenarios filed against prefix-dev/rip.

[snowflake-connector-rip-156]
# https://github.com/prefix-dev/rip/issues/156
# rip panicked when sdist build failed for snowflake-connector-python==2.9.0.
# nab does not build sdists, but the listing search still hits the same
# version space. Useful as a backtracking baseline.
