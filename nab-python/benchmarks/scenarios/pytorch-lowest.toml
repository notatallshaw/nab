# PyTorch ecosystem scenarios.
#
# torch / torchvision / torchaudio / pytorch-lightning / triton /
# deepspeed / fine-tuning stacks (trl, peft, axolotl).  Wheel-tag
# coverage gaps and tightly-coupled version triples cause most of
# the backtracking.

[torch-xpu-nightly]
# https://github.com/pytorch/pytorch/issues/148680
# Nightly index with mismatching versions -> pip tries every torch.
resolution = "lowest"
python_version = "3.10"
platform_system = "Linux"
datetime = "2025-03-06 15:44:50"
requirements = [
    "torch",
    "torchvision",
    "torchaudio",
]

[torch-vision-audio-pins]
# Users commonly pin inexact triples. The resolver has to scan all of
# torchvision's matrix looking for a compatible torch.
resolution = "lowest"
python_version = "3.11"
platform_system = "Linux"
datetime = "2025-03-01 10:00:00"
requirements = [
    "torch>=2.5,<2.6",
    "torchvision>=0.20,<0.21",
    "torchaudio>=2.5,<2.6",
]

[torch-flash-attn]
# https://github.com/huggingface/open-r1/issues/684
# flash_attn + torch version matrix grief.
resolution = "lowest"
python_version = "3.11"
platform_system = "Linux"
datetime = "2025-06-26 21:54:41"
requirements = [
    "torch==2.6.0",
    "flash_attn>=2.7.0",
    "transformers",
]

