# Resolver scenarios filed against astral-sh/uv.
#
# Requirement sets that caused slow resolution, excessive
# backtracking, wrong-version selection, or "no solution" errors in
# uv.  Some have since been fixed upstream; the inputs are kept as
# regression baselines.

[boto3-urllib3]
# https://github.com/astral-sh/uv/issues/1398 + rip #191 (same family)
# Classic backtracking storm: urllib3 chosen high, then botocore upper
# bound forces every minor of botocore to be tried.
python_version = "3.9"
platform_system = "Linux"
datetime = "2024-06-07 14:00:00"
requirements = ["boto3", "urllib3<2"]

[boto3-urllib3-transient]
# https://github.com/astral-sh/uv/issues/1398
# urllib3 upper bound surfaces only via dandi -> zarr-checksum -> boto3.
python_version = "3.9"
platform_system = "Linux"
datetime = "2023-10-01 14:00:00"
requirements = [
    "click >= 7.0",
    "click-loglevel ~= 0.2",
    "dandi >= 0.24.0",
    "psutil ~= 5.9",
