# ============================================================================
# Migrated from unsupported.toml (2026-04-27).  These were filed against
# original tool-specific features (uv universal resolution, multi-index,
# --pre flag, project install) but the requirement list itself is a valid
# single-platform PyPI input that nab can resolve.  Some need a
# pre-release pin to find a candidate.
# ============================================================================

[uv-pyspark-resolution]
# https://github.com/astral-sh/uv/issues/15293
# Originally a uv universal-resolution failure across platforms; the
# single-platform Linux input is a plain `pyspark` resolve.
python_version = "3.11"
platform_system = "Linux"
datetime = "2025-08-12 14:00:00"
requirements = ["pyspark"]

[uv-issue-9988-platform-pytorch]
# https://github.com/astral-sh/uv/issues/9988
# Two torch lines guarded by sys_platform/platform_machine markers.
# On Linux x86_64 only the second branch (torch>1.13) activates.
python_version = "3.11"
platform_system = "Linux"
datetime = "2024-12-18 03:35:04"
requirements = [
    "torch>1.13,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>1.13; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[uv-issue-11151-pypy-marker]
# https://github.com/astral-sh/uv/issues/11151
# vcrpy gated by platform_python_implementation != 'PyPy'; on host
# CPython both reqs are active.
python_version = "3.12"
platform_system = "Linux"
datetime = "2025-02-01 11:04:48"
requirements = [
    "urllib3==2.3.0",
    "vcrpy==7.0.0 ; platform_python_implementation != 'PyPy'",
]

[uv-issue-12797-torch-add]
# https://github.com/astral-sh/uv/issues/12797
# Originally a `uv add torch` index-selection issue; resolving plain
# `torch` against PyPI is a valid bench input.
python_version = "3.13"
platform_system = "Linux"
datetime = "2025-04-10 01:57:09"
requirements = ["torch"]

[uv-issue-9395-prerelease-sync]
# https://github.com/astral-sh/uv/issues/9395
# Originally needed --prerelease=allow.  At the chosen datetime PyPI
# already exposes stable torch + torchvision, so plain inputs resolve.
python_version = "3.12"
platform_system = "Linux"
datetime = "2024-12-04 14:00:00"
requirements = ["torch", "torchvision"]

[uv-issue-14269-torch-pep517]
# https://github.com/astral-sh/uv/issues/14269
# Originally a PEP 517 source-build issue; the requirement list is a
# realistic torch dev environment that resolves wheel-only on PyPI.
python_version = "3.13"
platform_system = "Linux"
datetime = "2025-06-26 09:13:40"
requirements = [
    "torch",
    "setuptools>=62.3.0",
    "wheel",
    "astunparse",
    "cmake>=3.27",
    "ninja",
    "numpy",
    "pyyaml",
    "requests",
    "typing-extensions>=4.10.0",
]

[uv-issue-18298-playwright-required]
# https://github.com/astral-sh/uv/issues/18298
# Originally a uv universal-resolution issue; plain `playwright` on
# Linux/3.11 is a small bench input.
python_version = "3.11"
platform_system = "Linux"
datetime = "2026-03-05 02:55:12"
requirements = ["playwright"]

[uv-issue-11636-llvmlite-prerelease]
# https://github.com/astral-sh/uv/issues/11636
# llvmlite==0.44.0 only exists as a pre-release on PyPI at the chosen
# date; needs a pre-release pin to find a candidate.
python_version = "3.13"
platform_system = "Linux"
datetime = "2025-02-19 20:01:16"
requirements = ["llvmlite==0.44.0"]

[uv-tensorflow-macos]
# https://github.com/astral-sh/uv/issues/13568
# Cross-platform resolution where tensorflow has different markers
# on macOS vs Linux. Now resolvable via Phase A impersonation.
python_version = "3.11"
datetime = "2025-06-09 14:00:00"
requirements = ["tensorflow"]
[uv-tensorflow-macos.marker_environment]
platform_system = "Darwin"
sys_platform = "darwin"
platform_machine = "arm64"

[uv-issue-8601-jax-py-marker]
# https://github.com/astral-sh/uv/issues/8601
# jax marker python_version >= "3.10" evaluates False on python 3.9 so
# the resolution is empty.  Single-tuple impersonation: just records that
# the marker correctly does not activate.
python_version = "3.9"
platform_system = "Linux"
datetime = "2024-10-27 01:41:35"
requirements = [
    'jax>=0.4.33;python_version>="3.10"',
]

[uv-issue-11664-pywin32-environments]
# https://github.com/astral-sh/uv/issues/11664
# pywin32 marker sys_platform == 'win32' is now exercised via Phase A
# impersonation (a single-tuple Windows resolve from any host).
python_version = "3.12"
datetime = "2025-02-20 12:19:21"
requirements = [
    "pywin32; sys_platform == 'win32'",
]
[uv-issue-11664-pywin32-environments.marker_environment]
platform_system = "Windows"
sys_platform = "win32"
os_name = "nt"
platform_machine = "AMD64"

[uv-add-torch-pytorch-index]
# https://github.com/astral-sh/uv/issues/12797
# torch resolution from a custom PyTorch CPU index alongside PyPI.
# Resolvable via the multi-index runner: torch is listed on both
# PyPI and the PyTorch CPU index; presence-based first-index picks
# PyPI (the first entry).
python_version = "3.13"
platform_system = "Linux"
datetime = "2025-04-10 14:00:00"
requirements = ["torch"]
[[uv-add-torch-pytorch-index.indexes]]
name = "pypi"
url = "https://pypi.org/simple/"
[[uv-add-torch-pytorch-index.indexes]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[uv-issue-16111-jax-extra-index]
# https://github.com/astral-sh/uv/issues/16111
# jax / jaxlib <= 0.3.15 are not on PyPI for Python 3.9 (Google's
# legacy storage bucket index).  Adding the legacy bucket as a
# secondary index lets presence-based first-index fall through to it
# for jax / jaxlib while staying on PyPI for everything else.
python_version = "3.9"
platform_system = "Linux"
datetime = "2025-10-03 07:39:25"
requirements = [
    "numpy >= 1.20.2,<1.24.4",
    "scipy >= 1.6.0,<1.11.1",
    "absl-py >= 0.12.0",
    "gdown >= 3.12.2",
    "tqdm >= 4.60.0",
    "flax >= 0.3.5",
    "jax <=0.3.15",
    "jaxlib <= 0.3.15",
    "ml_collections >= 0.1.0",
    "optax >= 0.0.6,<0.1.5",
    "tensorboard < 2.15",
    "tensorflow-probability == 0.17.0",
    "imageio >= 2.9.0",
    "imageio-ffmpeg >= 0.4.3",
    "wandb<0.19.12",
    "tensorboardX",
    "cython <3, >=0.29",
    "chex==0.1.5",
]
[[uv-issue-16111-jax-extra-index.indexes]]
name = "pypi"
url = "https://pypi.org/simple/"
[[uv-issue-16111-jax-extra-index.indexes]]
name = "jax-legacy"
url = "https://storage.googleapis.com/jax-releases/jax_releases.html"

[uv-issue-18278-h5py-myproject-style]
# https://github.com/astral-sh/uv/issues/18278
# zhqrbitee / 2026-03-03: order-dependent resolution; reduces to h5py
# 3.15.x + scientific stack DFS shape.
python_version = "3.13"
platform_system = "Darwin"
datetime = "2026-03-03 20:46:35"
requirements = ["h5py>=3.14.0", "scipy", "pandas"]

[uv-issue-18533-u8darts-sklearn]
# https://github.com/astral-sh/uv/issues/18533
# Adding scikit-learn>=1.6.0 silently downgrades u8darts from 0.41 to
# 0.39 with --resolution=highest.
python_version = "3.10"
platform_system = "Darwin"
datetime = "2026-03-17 22:32:57"
requirements = ["u8darts>=0.39.0", "scikit-learn>=1.6.0"]

[uv-issue-18440-pytorch-rocm-pypi-only]
# https://github.com/astral-sh/uv/issues/18440
# PyPI-only variant of the ROCm scenario in unsupported.toml.  uv
# 0.10.9 spent 3m52s resolving 34 pkgs for torch nightly + diffusers.
python_version = "3.13"
platform_system = "Linux"
datetime = "2026-03-13 09:33:36"
requirements = [
    "torch>=2.12.dev0",
    "torchvision>=0.26.0.dev0",
    "diffusers",
]
