# ----------------------------------------------------------------------
# Posts that need pip features nab does not model.
#
# vcs_dependencies        - "@ git+https://..." in requirements
# url_dependencies        - direct .whl / .tar.gz URL in requirements
# multiple_indexes        - --extra-index-url, --find-links
# project_install         - pip install . / -e .
# universal_resolution    - resolution must hold across platforms
# prerelease              - --pre or pin to .devN / .rcN
# build_dependencies      - sdist build inputs (e.g. cython, numpy)
# python_version_range    - resolution covering multiple python versions
#
# [so-flax-t5x-75755923]
# https://stackoverflow.com/q/75755923
# vcs_dependencies (flax + t5x git URLs)
#
# [so-jax-cuda-find-links-75802128]
# https://stackoverflow.com/q/75802128
# multiple_indexes (jax[cuda] --find-links)
#
# [so-rocm-torch-pytorch-discuss-106319]
# https://discuss.python.org/t/error-resolutionimpossible-runtimeerror-couldnt-install-torch/106319
# multiple_indexes (--index-url to ROCm nightlies)
#
