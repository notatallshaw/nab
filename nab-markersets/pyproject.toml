[project]
name = "nab-markersets"
version = "0.0.16.dev0"
description = "PEP 508 marker algebra: markers as sets of environments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Damian Shaw", email = "damian.peter.shaw@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# The engine imports `packaging._parser`, `packaging._tokenizer` and
# `packaging.markers._eval_op`, none of which packaging promises, so the range
# stops at the major this suite has been run against. Raise the cap only after
# running the suite on the new one.
dependencies = [
    "packaging>=26.3,<27",
]

[project.urls]
Homepage = "https://github.com/notatallshaw/nab"
Documentation = "https://nab.readthedocs.io/"
Issues = "https://github.com/notatallshaw/nab/issues"
Source = "https://github.com/notatallshaw/nab"
Changelog = "https://github.com/notatallshaw/nab/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
