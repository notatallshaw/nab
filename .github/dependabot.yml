version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directories:
      - /
      - /nab-resolver
      - /nab-markersets
      - /nab-provider
      - /nab-project
      - /nab-index
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # typos also tags its sub-crates (varcon-core-v5.0.7 sits on the v1.44.0
      # release), and the higher number reads as an upgrade.
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">=2"]
