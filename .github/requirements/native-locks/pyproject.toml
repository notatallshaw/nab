[project]
name = "nab-lockfile-consumers"
version = "0"
requires-python = "==3.14.*"

[dependency-groups]
pdm = ["pdm"]
poetry = ["poetry"]
uv = ["uv"]

[tool.nab]
decision-order = "stable"
uploaded-prior-to = "P7D"
dist-policy = "wheel-only"

[tool.nab.environment]
python = "3.14"
platform = "linux_x86_64"

[tool.nab.plans.pdm]
groups = ["pdm"]
output = "pylock.pdm.toml"

[tool.nab.plans.poetry]
groups = ["poetry"]
output = "pylock.poetry.toml"

[tool.nab.plans.uv]
groups = ["uv"]
output = "pylock.uv.toml"
