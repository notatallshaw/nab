name: CodeQL

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Python security and quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read  # Read source and repository metadata for analysis.
      security-events: write  # Upload results to code scanning.
      actions: read  # Read workflow metadata used by CodeQL.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: python
          build-mode: none
          queries: security-and-quality

      - name: Analyze Python
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:python
