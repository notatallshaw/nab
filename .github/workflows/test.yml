name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.workspace }} / ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # noxfile.py maps each workspace to its tests and coverage gates.
        workspace: [resolver, python, umbrella]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        name: Install Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.tests.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      # Test and coverage logic lives in noxfile.py. The workspace goes through
      # env, not inline ${{ }}, for zizmor; shell: bash expands it on Windows.
      - name: Test the ${{ matrix.workspace }} workspace
        run: nox -s "tests(workspace='${WORKSPACE}')"
        shell: bash
        env:
          WORKSPACE: ${{ matrix.workspace }}

  property-tests:
    name: Property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements/pylock.tests.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install third-party deps
        run: pip install -r .github/requirements/pylock.tests.toml

      - name: Install workspace packages
        run: pip install --no-deps -e nab-resolver -e nab-python -e nab-index -e .

      - name: Run property-based tests
        # CrossHair tests run in the dedicated crosshair-tests job; the
        # crosshair backend is not installed here, so skip that file.
        run: python -m pytest -m property --ignore=nab-resolver/tests/property/test_crosshair_ranges.py

  crosshair-tests:
    name: CrossHair property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # CrossHair's concolic backend tracks stable CPython releases;
          # use 3.12 rather than the prerelease pinned elsewhere.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/pylock.crosshair.toml

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install third-party deps
        run: pip install -r .github/requirements/pylock.crosshair.toml

      - name: Install workspace packages
        run: pip install --no-deps -e nab-resolver -e nab-python -e nab-index -e .

      - name: Run CrossHair property tests
        run: python -m pytest -m crosshair

  dists:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.dists.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      # Build logic lives in tasks/check_dists.py, driven by the dists session.
      - name: Build every distribution and install each sdist and wheel
        run: nox -s dists

  pass:
    name: All tests pass
    if: always()
    needs:
      - test
      - property-tests
      - crosshair-tests
      - dists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
