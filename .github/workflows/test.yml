name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  select:
    name: Select affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.select.outputs.workspaces }}
      test-paths: ${{ steps.select.outputs.test-paths }}
      resolver: ${{ steps.select.outputs.resolver }}
      benchmarks: ${{ steps.select.outputs.benchmarks }}
      dists: ${{ steps.select.outputs.dists }}
      standalone: ${{ steps.select.outputs.standalone }}
      allowed-skips: ${{ steps.select.outputs.allowed-skips }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Select workspaces from the PR changes
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tasks/select_tests.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  test:
    needs: select
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner || format('{0}-latest', matrix.os) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu
            python-version: "3.15t"
          # Keep old patch releases on an image that supplies them.
          - os: ubuntu
            python-version: "3.10.4"
            runner: ubuntu-24.04
          - os: ubuntu
            python-version: "3.11.0"
            runner: ubuntu-24.04
          - os: ubuntu
            python-version: "3.12.0"
            runner: ubuntu-24.04
          - os: ubuntu
            python-version: "3.13.0"
            runner: ubuntu-24.04
          - os: ubuntu
            python-version: "3.14.0"
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        name: Install Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.tests.toml
            .github/requirements/pylock.build.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      - name: Test affected workspaces
        shell: bash
        env:
          WORKSPACES: ${{ needs.select.outputs.workspaces }}
        run: |
          read -r -a workspaces <<< "$WORKSPACES"
          nox -s tests -- "${workspaces[@]}"

  benchmarks:
    needs: select
    if: needs.select.outputs.benchmarks == 'true'
    name: benchmark harness / ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # These cover the benchmarks directories, which are developer tooling
      # rather than shipped code, so they run on the ends of the supported
      # range instead of the full matrix. Windows earns its cell because the
      # harness builds output paths and the tests pin its device-name rules.
      matrix:
        include:
          - os: ubuntu
            python-version: "3.10"
          - os: ubuntu
            python-version: "3.15"
          - os: windows
            python-version: "3.15"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        name: Install Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.tests.toml
            .github/requirements/pylock.build.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      - name: Run the benchmark-harness tests
        run: nox -s benchmarks

  property-tests:
    needs: select
    name: Property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.tests.toml
            .github/requirements/pylock.build.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install third-party deps
        run: pip install -r .github/requirements/pylock.tests.toml

      - name: Install the build backend
        run: pip install -r .github/requirements/pylock.build.toml

      - name: Install workspace packages
        run: pip install --no-deps --no-build-isolation -e nab-resolver -e nab-markersets -e nab-provider -e nab-project -e nab-index -e .

      - name: Run property-based tests
        # CrossHair tests run in the dedicated crosshair-tests job; the
        # crosshair backend is not installed here, so skip that file.
        env:
          TEST_PATHS: ${{ needs.select.outputs.test-paths }}
        run: |
          read -r -a test_paths <<< "$TEST_PATHS"
          python -m pytest -n auto --dist worksteal -m property --ignore=nab-resolver/tests/property/test_crosshair_ranges.py "${test_paths[@]}"

  crosshair-tests:
    needs: select
    if: needs.select.outputs.resolver == 'true'
    name: CrossHair property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # CrossHair's concolic backend tracks stable CPython releases;
          # use 3.12 rather than the prerelease pinned elsewhere.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.crosshair.toml
            .github/requirements/pylock.build.toml

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install third-party deps
        run: pip install -r .github/requirements/pylock.crosshair.toml

      - name: Install the build backend
        run: pip install -r .github/requirements/pylock.build.toml

      - name: Install workspace packages
        run: pip install --no-deps --no-build-isolation -e nab-resolver -e nab-markersets -e nab-provider -e nab-project -e nab-index -e .

      - name: Run CrossHair property tests
        run: python -m pytest -m crosshair nab-resolver/tests

  dists:
    needs: select
    if: needs.select.outputs.dists == 'true'
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.dists.toml
            .github/requirements/pylock.build.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      # Build logic lives in tasks/check_dists.py, driven by the dists session.
      - name: Build every distribution and install each sdist and wheel
        run: nox -s dists

  standalone:
    needs: select
    if: needs.select.outputs.standalone == 'true'
    name: nab-markersets on released packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.tests.toml
            .github/requirements/pylock.build.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      # Without nab-provider installed the algebra binds released packaging,
      # which no other job reaches.
      - name: Run the marker-set suite without the vendored fork
        run: nox -s standalone

  pass:
    name: All tests pass
    if: always()
    needs:
      - select
      - test
      - benchmarks
      - property-tests
      - crosshair-tests
      - dists
      - standalone
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          allowed-skips: ${{ needs.select.outputs.allowed-skips }}
          jobs: ${{ toJSON(needs) }}
