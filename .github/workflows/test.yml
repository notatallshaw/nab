name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        name: Install Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.tests.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      # Test and coverage logic lives in noxfile.py. The tests session is
      # parametrized by workspace, so this runs all three, each in its own
      # venv and gated on its own packages.
      - name: Test every workspace
        run: nox -s tests

  benchmarks:
    name: benchmark harness / ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # These cover nab-python/benchmarks, which is developer tooling rather
      # than shipped code, so they run on the ends of the supported range
      # instead of the full matrix. Windows earns its cell because the
      # harness builds output paths and the tests pin its device-name rules.
      matrix:
        include:
          - os: ubuntu
            python-version: "3.10"
          - os: ubuntu
            python-version: "3.14"
          - os: windows
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        name: Install Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.tests.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      - name: Run the benchmark-harness tests
        run: nox -s benchmarks

  property-tests:
    name: Property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements/pylock.tests.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install third-party deps
        run: pip install -r .github/requirements/pylock.tests.toml

      - name: Install workspace packages
        run: pip install --no-deps -e nab-resolver -e nab-python -e nab-index -e .

      - name: Run property-based tests
        # CrossHair tests run in the dedicated crosshair-tests job; the
        # crosshair backend is not installed here, so skip that file.
        run: python -m pytest -m property --ignore=nab-resolver/tests/property/test_crosshair_ranges.py

  crosshair-tests:
    name: CrossHair property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # CrossHair's concolic backend tracks stable CPython releases;
          # use 3.12 rather than the prerelease pinned elsewhere.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/pylock.crosshair.toml

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install third-party deps
        run: pip install -r .github/requirements/pylock.crosshair.toml

      - name: Install workspace packages
        run: pip install --no-deps -e nab-resolver -e nab-python -e nab-index -e .

      - name: Run CrossHair property tests
        run: python -m pytest -m crosshair

  dists:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.dists.toml
            .github/requirements/pylock.build.toml
          allow-prereleases: true

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      # Build logic lives in tasks/check_dists.py, driven by the dists session.
      - name: Build every distribution and install each sdist and wheel
        run: nox -s dists

  pass:
    name: All tests pass
    if: always()
    needs:
      - test
      - benchmarks
      - property-tests
      - crosshair-tests
      - dists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
