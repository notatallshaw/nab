name: Update locks

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh locks
    if: github.repository == 'notatallshaw/nab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      source: ${{ steps.source.outputs.commit }}
    steps:
      - id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: python -m pip install "pip>=26.3"
      - run: python -m pip install --group pylock.dev.toml:nox

      - name: Refresh with the current checkout
        run: python -m nox -s locks -- --lock-policy resolve --upgrade

      - name: Check refreshed locks
        run: python -m nox -s locks -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-locks
          path: |
            pylock.dev.toml
            .github/requirements/pylock.build.toml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open dependency PR
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Push the managed lock-update branch and sign its commit.
      pull-requests: write # Open or update its draft PR.
    outputs:
      changed: ${{ steps.pr.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.source }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed-locks

      - name: Open or update the dependency PR
        id: pr
        uses: notatallshaw/nab/.github/actions/update-lock-pr@3ac908431b8213abff1d4a3dba97d96ff2f58882

  checks:
    name: Start dependency checks
    needs: pull-request
    if: needs.pull-request.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch CI for the managed update branch.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # GITHUB_TOKEN-created PRs otherwise need approval before their CI starts.
      - run: gh workflow run test.yml --ref ci/update-locks
      - run: gh workflow run lint.yml --ref ci/update-locks
