name: Update locks

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh locks
    if: github.repository == 'notatallshaw/nab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      source: ${{ steps.source.outputs.commit }}
    steps:
      - id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: python -m pip install "pip>=26.3"
      - run: python -m pip install --group pylock.dev.toml:nox

      - name: Refresh with the current checkout
        run: python -m nox -s locks -- --lock-policy resolve --upgrade

      - name: Check refreshed locks
        run: python -m nox -s locks -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-locks
          path: |
            pylock.dev.toml
            .github/requirements/pylock.build.toml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open dependency PR
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dependency-updates
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.source }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed-locks

      - name: Create publishing token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the dependency PR
        run: python3 tasks/update_lock_pr.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
