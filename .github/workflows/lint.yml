name: Lint

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lock-updater-action:
    name: Unchanged dependency locks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: publish
        uses: notatallshaw/nab/.github/actions/update-lock-pr@3ac908431b8213abff1d4a3dba97d96ff2f58882

      - run: test "$CHANGED" = false
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pylock.dev.toml

      - name: Ensure pip supports locked groups
        run: python -m pip install "pip>=26.3"

      - name: Install pre-commit
        run: pip install --group pylock.dev.toml:pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  vendor:
    name: vendored packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check vendored packaging matches pin plus patch
        run: tasks/vendor-packaging.sh --check

  boundaries:
    name: import boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # Stdlib only, so there is nothing to install and no lock to pin.
      - name: Check workspace import boundaries
        run: python tasks/check_boundaries.py

      - name: Check the resolve engine takes no marker-set dependency
        run: python tasks/check_engine_markersets.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pylock.dev.toml

      - name: Ensure pip supports locked groups
        run: python -m pip install "pip>=26.3"

      - name: Install docs deps
        run: pip install --group pylock.dev.toml:docs

      # Same lock and same sphinx invocation Read the Docs runs
      # (.readthedocs.yaml), so a dead cross-reference fails the PR rather
      # than the publish.  -W turns warnings into errors.
      - name: Build the docs
        run: python -m sphinx -n -W -b html docs docs/_build/html

  locks:
    name: development locks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pylock.dev.toml
            .github/requirements/pylock.build.toml
      - run: python -m pip install "pip>=26.3"
      - run: python -m pip install --group pylock.dev.toml:nox
      - run: python -m nox -s locks -- --locked

  types:
    name: ${{ matrix.checker }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checker: [mypy, pyright, ty, pyrefly, zuban]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pylock.dev.toml
            .github/requirements/pylock.build.toml

      - name: Ensure pip supports locked groups
        run: python -m pip install "pip>=26.3"

      - name: Install nox
        run: pip install --group pylock.dev.toml:nox

      # Type-check logic lives in noxfile.py. The checker goes through env,
      # not inline ${{ }}, for zizmor.
      - name: Run ${{ matrix.checker }}
        run: nox -s "types(checker='${CHECKER}')"
        env:
          CHECKER: ${{ matrix.checker }}
