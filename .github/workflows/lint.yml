name: Lint

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/pylock.pre-commit.toml

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install pre-commit
        run: pip install -r .github/requirements/pylock.pre-commit.toml

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  vendor:
    name: vendored packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check vendored packaging matches pin plus patch
        run: tasks/vendor-packaging.sh --check

  boundaries:
    name: import boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Stdlib only, so there is nothing to install and no lock to pin.
      - name: Check workspace import boundaries
        run: python tasks/check_boundaries.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/pylock.docs.toml

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install docs deps
        run: pip install -r .github/requirements/pylock.docs.toml

      # Same lock and same sphinx invocation Read the Docs runs
      # (.readthedocs.yaml), so a dead cross-reference fails the PR rather
      # than the publish.  -W turns warnings into errors.
      - name: Build the docs
        run: python -m sphinx -W -b html docs docs/_build/html

  types:
    name: ${{ matrix.checker }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checker: [mypy, pyright, ty, pyrefly, zuban]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .github/requirements/pylock.nox.toml
            .github/requirements/pylock.types.toml

      - name: Upgrade pip to PEP 751 install support
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install nox
        run: pip install -r .github/requirements/pylock.nox.toml

      # Type-check logic lives in noxfile.py. The checker goes through env,
      # not inline ${{ }}, for zizmor.
      - name: Run ${{ matrix.checker }}
        run: nox -s "types(checker='${CHECKER}')"
        env:
          CHECKER: ${{ matrix.checker }}
