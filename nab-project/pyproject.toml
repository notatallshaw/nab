[project]
name = "nab-project"
version = "0.0.31.dev0"
description = "Python project resolution, lockfiles and downloads for nab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Damian Shaw", email = "damian.peter.shaw@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "nab-markersets==0.0.31.dev0",
    "nab-provider==0.0.31.dev0",
    "nab-resolver==0.0.31.dev0",
    "nab-index==0.0.31.dev0",
    # fetch.py normalises a name for nab-index's API, which is typed in
    # released packaging's NormalizedName.
    "packaging>=24.0",
    # toml_io builds TOMLDecodeError(msg, doc, pos), a signature 2.2 added.
    "tomli>=2.2",
    "build>=1.2",
    "installer>=1.0",
    "pyproject_hooks>=1.2",
    "typing_extensions>=4.6",
]

[project.urls]
Homepage = "https://github.com/notatallshaw/nab"
Documentation = "https://nab.readthedocs.io/"
Issues = "https://github.com/notatallshaw/nab/issues"
Source = "https://github.com/notatallshaw/nab"
Changelog = "https://github.com/notatallshaw/nab/releases"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

# The benchmark harness and the tests that need it run from the checkout.
[tool.hatch.build.targets.sdist]
exclude = ["/benchmarks", "/tests/benchmark", "/tests/test_deterministic_smoke_core.py"]

# The checkout imports the fixtures as a plugin. In the archive, pytest finds
# its config at the root and the same fixtures in tests/conftest.py.
[tool.hatch.build.targets.sdist.sources]
"test-support/nab_test_support" = ""
