<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache: uv 0.31 s; nab 0.76 s; Poetry 1.2 s; PDM 1.4 s warm cache: uv 9.1 ms; nab 0.31 s; Poetry 0.83 s; PDM 0.88 s Estimated interpreter and import components for Python tools: cold nab interpreter 11 ms, imports 0.15 s; cold Poetry interpreter 10 ms, imports 0.48 s; cold PDM interpreter 11 ms, imports 0.25 s; warm nab interpreter 8.3 ms, imports 0.14 s; warm Poetry interpreter 8.3 ms, imports 0.50 s; warm PDM interpreter 8.6 ms, imports 0.25 s All bars include interpreter launch and imports, including imports deferred until locking. uv is shown whole. Both panels use the same linear scale. Shorter is faster.</desc>
