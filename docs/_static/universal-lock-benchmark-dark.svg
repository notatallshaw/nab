<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache: uv 0.24 s; nab 0.68 s; Poetry 1.2 s; PDM 1.3 s warm cache: uv 11 ms; nab 0.18 s; Poetry 0.77 s; PDM 0.85 s Estimated interpreter and import components for Python tools: cold nab interpreter 12 ms, imports 0.18 s; cold Poetry interpreter 12 ms, imports 0.53 s; cold PDM interpreter 12 ms, imports 0.27 s; warm nab interpreter 8.7 ms, imports 65 ms; warm Poetry interpreter 8.6 ms, imports 0.47 s; warm PDM interpreter 8.5 ms, imports 0.23 s All bars include interpreter launch and imports, including imports deferred until locking. uv is shown whole. Both panels use the same linear scale. Shorter is faster.</desc>
