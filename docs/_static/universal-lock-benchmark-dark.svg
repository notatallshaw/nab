<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache, GitHub CI · 3.15: uv 0.21 s, nab 0.51 s, Poetry 0.8 s, PDM 1 s; warm cache, GitHub CI · 3.15: uv 9.5 ms, nab 0.18 s, Poetry 0.49 s, PDM 0.73 s. Complete native lock commands, including startup. Resolver cores: uv Rust; nab, Poetry and PDM Python. Same linear scale; shorter is faster.</desc>
