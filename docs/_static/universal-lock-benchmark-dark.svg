<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache, Local desktop · 3.15: uv 0.23 s, nab 0.57 s, Poetry 0.98 s, PDM 1.2 s; warm cache, Local desktop · 3.15: uv 11 ms, nab 0.17 s, Poetry 0.72 s, PDM 0.81 s. Complete native lock commands, including startup. Resolver cores: uv Rust; nab, Poetry and PDM Python. Same linear scale; shorter is faster.</desc>
