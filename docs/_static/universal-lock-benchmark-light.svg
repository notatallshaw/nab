<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">Universal lock generation with an empty cache</title>
<desc id="desc">uv: 0.28 seconds; nab: 0.45 seconds; Poetry: 1.1 seconds; PDM: 1.3 seconds. Shorter bars are faster.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="24" y="28" fill="#1f2328" font-size="15" font-weight="600">Empty cache</text>
<text x="684" y="28" text-anchor="end" fill="#59636e" font-size="13">lower is faster</text>
<path d="M124 50V234" stroke="#d1d9e0"/>
<text x="104" y="80" text-anchor="end" fill="#1f2328" font-size="16" font-weight="400">uv</text>
<rect x="124" y="60" width="96.536" height="26" rx="4" fill="#8592a3"/>
<text x="232.536" y="80" fill="#1f2328" font-size="15" font-weight="400">0.28 s</text>
<text x="104" y="126" text-anchor="end" fill="#1f2328" font-size="16" font-weight="600">nab</text>
<rect x="124" y="106" width="157.549" height="26" rx="4" fill="#7c3aed"/>
<text x="293.549" y="126" fill="#1f2328" font-size="15" font-weight="600">0.45 s</text>
<text x="104" y="172" text-anchor="end" fill="#1f2328" font-size="16" font-weight="400">Poetry</text>
<rect x="124" y="152" width="376.003" height="26" rx="4" fill="#8592a3"/>
<text x="512.003" y="172" fill="#1f2328" font-size="15" font-weight="400">1.1 s</text>
<text x="104" y="218" text-anchor="end" fill="#1f2328" font-size="16" font-weight="400">PDM</text>
<rect x="124" y="198" width="450.000" height="26" rx="4" fill="#8592a3"/>
<text x="586.000" y="218" fill="#1f2328" font-size="15" font-weight="400">1.3 s</text>
</g>
</svg>
