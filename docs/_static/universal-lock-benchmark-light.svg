<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache: uv 0.41 s; nab 0.88 s; Poetry 1.3 s; PDM 2.0 s warm cache: uv 12 ms; nab 0.20 s; Poetry 0.84 s; PDM 0.90 s Estimated interpreter and import components for Python tools: cold nab interpreter 13 ms, imports 0.24 s; cold Poetry interpreter 12 ms, imports 0.40 s; cold PDM interpreter 12 ms, imports 0.36 s; warm nab interpreter 9.3 ms, imports 69 ms; warm Poetry interpreter 9 ms, imports 0.53 s; warm PDM interpreter 8.7 ms, imports 0.28 s All bars include interpreter launch and imports, including imports deferred until locking. uv is shown whole. Both panels use the same linear scale. Shorter is faster.</desc>
