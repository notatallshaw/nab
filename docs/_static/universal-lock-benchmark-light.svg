<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache: uv 0.19 s; nab 0.55 s; Poetry 0.90 s; PDM 1.2 s warm cache: uv 9.4 ms; nab 0.18 s; Poetry 0.77 s; PDM 0.82 s Estimated interpreter and import components for Python tools: cold nab interpreter 11 ms, imports 0.19 s; cold Poetry interpreter 11 ms, imports 0.31 s; cold PDM interpreter 11 ms, imports 0.28 s; warm nab interpreter 7.9 ms, imports 64 ms; warm Poetry interpreter 8 ms, imports 0.46 s; warm PDM interpreter 7.9 ms, imports 0.22 s All bars include interpreter launch and imports, including imports deferred until locking. uv is shown whole. Both panels use the same linear scale. Shorter is faster.</desc>
