<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache: uv 0.62 s; nab 1.5 s; Poetry 2.0 s; PDM 1.9 s warm cache: uv 8.9 ms; nab 0.20 s; Poetry 0.77 s; PDM 0.82 s Estimated interpreter and import components for Python tools: cold nab interpreter 10 ms, imports 0.14 s; cold Poetry interpreter 10 ms, imports 0.46 s; cold PDM interpreter 10 ms, imports 0.23 s; warm nab interpreter 7.8 ms, imports 64 ms; warm Poetry interpreter 7.9 ms, imports 0.45 s; warm PDM interpreter 8.1 ms, imports 0.22 s All bars include interpreter launch and imports, including imports deferred until locking. uv is shown whole. Both panels use the same linear scale. Shorter is faster.</desc>
