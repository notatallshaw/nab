<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache: uv 0.28 s; nab 0.65 s; Poetry 1.1 s; PDM 1.3 s warm cache: uv 8.7 ms; nab 0.30 s; Poetry 0.78 s; PDM 0.84 s Python startup estimates: nab 0.12 s; Poetry 0.61 s; PDM 0.17 s All bars include startup. uv is shown whole. Both panels use the same linear scale. Shorter is faster.</desc>
