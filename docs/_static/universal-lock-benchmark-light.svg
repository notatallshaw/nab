<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">Universal lock generation with cold and warm caches</title>
<desc id="desc">cold cache: uv 0.34 s; nab 0.86 s; Poetry 1.4 s; PDM 1.5 s warm cache: uv 9.7 ms; nab 0.29 s; Poetry 0.85 s; PDM 0.88 s Estimated interpreter and import components for Python tools: cold nab interpreter 11 ms, imports 0.15 s; cold Poetry interpreter 11 ms, imports 0.49 s; cold PDM interpreter 11 ms, imports 0.24 s; warm nab interpreter 8.6 ms, imports 0.15 s; warm Poetry interpreter 8.7 ms, imports 0.51 s; warm PDM interpreter 8.7 ms, imports 0.24 s All bars include interpreter launch and imports, including imports deferred until locking. uv is shown whole. Both panels use the same linear scale. Shorter is faster.</desc>
