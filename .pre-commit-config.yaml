repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pycqa/flake8
    rev: 1c7fec1973ed3a7c192dbe1e96906fbbd1dbe49e  # frozen: 7.5.0
    hooks:
      - id: flake8
        name: Check lazy import declarations
        files: ^(?:nab-[^/]+/)?src/

        additional_dependencies: [flake8-lazy==0.11.0]
        # Nab names relative imports absolutely and selects lazy dependencies per module.
        args: [--isolated, "--select=LZY201,LZY203,LZY204,LZY205,LZY3,LZY401"]

  - repo: https://github.com/crate-ci/typos
    rev: ef3265d70a75c507b4c110d855cdfab6ce90d4bf  # frozen: v1.52.0
    hooks:
      - id: typos
        # Benchmarks, CI lockfiles, captured lock data are
        # full of real PyPI names typos misreads.
        exclude: ^(pylock\.dev\.toml$|nab-project/benchmarks/|nab-project/tests/data/|\.github/requirements/)
        args: []

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=auditor]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout
      - id: check-readthedocs

  - repo: https://github.com/executablebooks/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
    hooks:
      - id: mdformat
        language_version: python3.13
        additional_dependencies: [mdformat-myst==0.3.0, mdformat-gfm-alerts==2.1.0, mdformat-deflist==0.1.4]
