repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        # Vendoring patches carry unified-diff context lines whose
        # leading space must survive verbatim for git apply.
        exclude: ^tasks/vendoring/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: 512fc24f32f44ab01972217aaaf3dc86ec234d53  # frozen: v1.50.2
    hooks:
      - id: typos
        # Benchmarks, CI lockfiles, captured lock data and vendored code are
        # full of real PyPI names typos misreads.
        exclude: ^(nab-project/benchmarks/|nab-project/tests/data/|\.github/requirements/|.*/_vendor/)
        args: []

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=auditor]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
