# The contributor's environment, at the path docs/contributing.md runs its
# tools from. Every other environment is detached or names itself as its own
# template, because inheriting `path` would land it here too.
[envs.default]
installer = "pip"
path = ".venv"
workspace.members = [
    "nab-resolver",
    "nab-markersets",
    "nab-provider",
    "nab-project",
    "nab-index",
]
dependency-groups = ["tests", "nox"]
# The umbrella pins its siblings to the unreleased version under development,
# and hatch installs it before syncing the members, so the members go in first.
# Hatch runs a pre-install command in the directory it was invoked from, so the
# paths are anchored at `{root}` rather than left relative.
pre-install-commands = [
    'python -m pip install "pip>=26.3"',
    'python -m pip install -r "{root}/.github/requirements/pylock.build.toml"',
    'python -m pip install -r "{root}/pylock.dev.toml"',
    'python -m pip install --no-deps --no-build-isolation -e "{root}/nab-resolver" -e "{root}/nab-markersets" -e "{root}/nab-provider" -e "{root}/nab-index" -e "{root}/nab-project"',
]

[envs.hatch-test]
template = "hatch-test"
installer = "pip"
dependencies = []
dependency-groups = ["hatch-test"]
pre-install-commands = [
    'python -m pip install "pip>=26.3"',
    'python -m pip install -r "{root}/.github/requirements/pylock.build.toml"',
    'python -m pip install --group "{root}/pylock.dev.toml:hatch-test"',
    'python -m pip install --no-deps --no-build-isolation -e "{root}/nab-resolver" -e "{root}/nab-markersets" -e "{root}/nab-provider" -e "{root}/nab-index" -e "{root}/nab-project"',
]
workspace.members = [
    "nab-resolver",
    "nab-markersets",
    "nab-provider",
    "nab-project",
    "nab-index",
]
features = ["httpx", "httpx2"]

[envs.crosshair]
template = "crosshair"
installer = "pip"
dependency-groups = ["crosshair"]
pre-install-commands = [
    'python -m pip install "pip>=26.3"',
    'python -m pip install -r "{root}/.github/requirements/pylock.build.toml"',
    'python -m pip install --group "{root}/pylock.dev.toml:crosshair"',
    'python -m pip install --no-deps --no-build-isolation -e "{root}/nab-resolver" -e "{root}/nab-markersets" -e "{root}/nab-provider" -e "{root}/nab-index" -e "{root}/nab-project"',
]
workspace.members = [
    "nab-resolver",
    "nab-markersets",
    "nab-provider",
    "nab-project",
    "nab-index",
]

[envs.crosshair.scripts]
check = "pytest -m crosshair {args}"

[envs.types]
installer = "pip"
detached = true
dependency-groups = []

[envs.types.scripts]
_sync = [
    'python -m pip install "pip>=26.3"',
    'python -m pip install --group "{root}/pylock.dev.toml:nox"',
]
check-pyright = ["_sync", "nox -s \"types(checker='pyright')\" {args}"]
check-mypy = ["_sync", "nox -s \"types(checker='mypy')\" {args}"]
check-ty = ["_sync", "nox -s \"types(checker='ty')\" {args}"]
check-pyrefly = ["_sync", "nox -s \"types(checker='pyrefly')\" {args}"]
check-zuban = ["_sync", "nox -s \"types(checker='zuban')\" {args}"]
all = ["_sync", "nox -s types {args}"]

[envs.lint]
installer = "pip"
detached = true
python = "3.13"
dependency-groups = []

[envs.lint.scripts]
_sync = [
    'python -m pip install "pip>=26.3"',
    'python -m pip install --group "{root}/pylock.dev.toml:lint"',
]
check = ["_sync", "ruff check .", "mdformat --check ."]
fix = ["_sync", "ruff check --fix ."]
fmt = ["_sync", "ruff format .", "mdformat ."]
fmt-check = ["_sync", "ruff format --check .", "mdformat --check ."]

# Development tools and CI select groups from the same root lock.
#
# `template` also keeps out the workspace members: hatch installs them editable
# even under `skip-install`, and neither CI nor Read the Docs has the project in
# the environment it builds the docs from.
[envs.docs]
installer = "pip"
template = "docs"
python = "3.13"
skip-install = true
dependency-groups = []

[envs.docs.scripts]
_sync = [
    'python -m pip install "pip>=26.3"',
    'python -m pip install --group "{root}/pylock.dev.toml:docs"',
]
build = ["_sync", "sphinx-build -n -W -b html docs docs/_build/html {args}"]
serve = [
    "_sync",
    'python -m pip install --group "{root}/pylock.dev.toml:docs-live"',
    "sphinx-autobuild docs docs/_build/html {args}",
]
clean = "rm -rf docs/_build"

[envs.release]
installer = "pip"
detached = true

[envs.release.scripts]
# Install only the hash-pinned lock; never resolve unpinned dependencies.
_sync = [
    'python -m pip install "pip>=26.3"',
    'python -m pip install --group "{root}/pylock.dev.toml:release"',
    'python -m pip install -r "{root}/.github/requirements/pylock.build.toml"',
]
make = ["_sync", "python tasks/release.py make {args}"]
build = ["_sync", "python tasks/build_dists.py {args}"]
