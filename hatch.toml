[envs.default]
workspace.members = ["nab-resolver", "nab-provider", "nab-python", "nab-index"]

[envs.hatch-test]
workspace.members = ["nab-resolver", "nab-provider", "nab-python", "nab-index"]
features = ["httpx"]
extra-dependencies = [
    "hypothesis>=6.100",
    "pytest-timeout>=2.3",
    "respx>=0.22",
]

[envs.crosshair]
workspace.members = ["nab-resolver", "nab-provider", "nab-python", "nab-index"]
extra-dependencies = [
    "crosshair-tool>=0.0.104",
    "hypothesis-crosshair>=0.0.28",
    "hypothesis>=6.100",
    "pytest>=9.0",
    "pytest-timeout>=2.3",
]

[envs.crosshair.scripts]
check = "pytest -m crosshair {args}"

[envs.types]
workspace.members = ["nab-resolver", "nab-provider", "nab-python", "nab-index"]
dependencies = [
    "pyright>=1.1.400",
    "mypy>=1.19",
    "ty>=0.0.20",
    "pyrefly>=0.50",
    "zuban>=0.6",
    "pytest>=9.0",
    "hypothesis>=6.100",
    "pytest-timeout>=2.3",
]

[envs.types.scripts]
check-pyright = "pyright {args}"
check-mypy = "mypy {args:nab-resolver/src}"
check-ty = "ty check {args:nab-resolver/src}"
check-pyrefly = "pyrefly check {args:nab-resolver/src}"
check-zuban = "zuban check {args:nab-resolver/src}"
all = ["check-pyright", "check-mypy", "check-ty", "check-pyrefly", "check-zuban"]

[envs.lint]
detached = true
dependencies = ["ruff>=0.12"]

[envs.lint.scripts]
check = "ruff check ."
fix = "ruff check --fix ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."

# The docs dependency-group in pyproject.toml is the single source of truth: it
# is what nab locks into .github/requirements/pylock.docs.toml, which is what CI
# and Read the Docs install.  Only the live-reload server is local-only.
[envs.docs]
skip-install = true
dependency-groups = ["docs"]
dependencies = [
    "sphinx-autobuild>=2024.10",
]

[envs.docs.scripts]
build = "sphinx-build -W -b html docs docs/_build/html {args}"
serve = "sphinx-autobuild docs docs/_build/html {args}"
clean = "rm -rf docs/_build"

[envs.release]
detached = true

[envs.release.scripts]
# Install only the hash-pinned lock; never resolve unpinned dependencies.
_sync = [
    'python -m pip install --upgrade "pip>=26.1"',
    "python -m pip install -r .github/requirements/pylock.release.toml",
    "python -m pip install -r .github/requirements/pylock.build.toml",
]
make = ["_sync", "python tasks/release.py make {args}"]
build = ["_sync", "python tasks/build_dists.py {args}"]
