version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # Group selection from a Pylock file requires pip 26.3.
      - python -m pip install "pip>=26.3"
      - python -m pip install --group pylock.dev.toml:docs
    build:
      html:
        - python -m sphinx -n -W -b html docs $READTHEDOCS_OUTPUT/html
